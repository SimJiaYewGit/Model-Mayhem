<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Arena - AI Model Battler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 3em;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 1.2em;
    }

    .game-section {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel h2 {
      margin-bottom: 15px;
      color: #00d9ff;
      font-size: 1.3em;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 0.9em;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      color: #fff;
      font-size: 1em;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      color: #1a1a2e;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .arena-display {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 20px;
      min-height: 500px;
      position: relative;
    }

    .arena-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 2px;
      height: 400px;
      margin-bottom: 20px;
    }

    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      position: relative;
    }

    .cell.wall {
      background: rgba(100, 100, 100, 0.5);
    }

    .cell.hazard {
      background: rgba(255, 50, 50, 0.3);
    }

    .cell.powerup-health {
      background: rgba(0, 255, 100, 0.3);
    }

    .cell.powerup-energy {
      background: rgba(0, 100, 255, 0.3);
    }

    .bot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.7em;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .bot-player1 {
      background: linear-gradient(135deg, #00d9ff, #0099ff);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
    }

    .bot-player2 {
      background: linear-gradient(135deg, #ff6600, #ff3300);
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
    }

    .health-bar {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00d9ff);
      transition: width 0.3s ease;
    }

    .logs-panel {
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
    }

    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.8em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-waiting { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
    .status-ready { background: rgba(0, 217, 255, 0.3); color: #00d9ff; }
    .status-running { background: rgba(0, 255, 136, 0.3); color: #00ff88; }
    .status-finished { background: rgba(255, 50, 50, 0.3); color: #ff3333; }

    .model-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 5px;
    }

    .stat-label {
      font-size: 0.75em;
      color: #888;
    }

    .stat-value {
      font-size: 1.1em;
      color: #00d9ff;
    }

    .action-display {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚔️ Agent Arena</h1>
      <p class="subtitle">Build your bot. Tune its mind. Watch it battle.</p>
    </header>

    <div class="game-section">
      <!-- Player 1 Configuration -->
      <div class="panel">
        <h2>🔵 Player 1 Setup</h2>
        <div class="form-group">
          <label>Player Name</label>
          <input type="text" id="player1Name" value="Trainer Alpha" />
        </div>
        <div class="form-group">
          <label>Model Name</label>
          <input type="text" id="player1Model" value="llama3.2:1b" placeholder="e.g., llama3.2:1b, gemma:2b" />
        </div>
        <div class="form-group">
          <label>System Prompt</label>
          <textarea id="player1Prompt" placeholder="Enter your AI's strategic instructions...">You are an aggressive but controlled battle agent. Prioritize attacking when enemy HP is low. Defend when your HP is below 30. Be strategic about positioning.</textarea>
        </div>
        <div class="form-group">
          <label>Max Tokens per Decision</label>
          <input type="number" id="player1Tokens" value="150" min="50" max="500" />
        </div>
        <div class="form-group">
          <label>Temperature</label>
          <input type="range" id="player1Temp" min="0" max="1" step="0.1" value="0.4" />
          <span id="player1TempValue">0.4</span>
        </div>
        <button onclick="joinGame('player1')">Join Arena</button>
        
        <div id="player1Stats" class="hidden">
          <h3 style="margin-top: 20px; color: #00d9ff;">Bot Status</h3>
          <div class="health-bar">
            <div id="player1Health" class="health-fill" style="width: 100%"></div>
          </div>
          <div id="player1Action" class="action-display">Waiting...</div>
        </div>
      </div>

      <!-- Arena Display -->
      <div class="panel arena-display">
        <h2>🏟️ Battle Arena</h2>
        <div id="gameStatus" class="status-badge status-waiting">Waiting for players</div>
        
        <div class="arena-grid" id="arenaGrid">
          <!-- Grid cells generated by JS -->
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>Tick:</strong> <span id="tickCounter">0</span>
          </div>
          <button id="startBtn" onclick="startGame()" disabled>Start Battle</button>
          <button id="nextTickBtn" onclick="nextTick()" disabled>Next Tick</button>
        </div>
      </div>

      <!-- Player 2 Configuration -->
      <div class="panel">
        <h2>🔴 Player 2 Setup</h2>
        <div class="form-group">
          <label>Player Name</label>
          <input type="text" id="player2Name" value="Trainer Beta" />
        </div>
        <div class="form-group">
          <label>Model Name</label>
          <input type="text" id="player2Model" value="gemma:2b" placeholder="e.g., llama3.2:1b, gemma:2b" />
        </div>
        <div class="form-group">
          <label>System Prompt</label>
          <textarea id="player2Prompt" placeholder="Enter your AI's strategic instructions...">You are a defensive counter-attacker. Wait for opportunities. Shield when health is low. Attack when enemy is vulnerable. Use terrain to your advantage.</textarea>
        </div>
        <div class="form-group">
          <label>Max Tokens per Decision</label>
          <input type="number" id="player2Tokens" value="150" min="50" max="500" />
        </div>
        <div class="form-group">
          <label>Temperature</label>
          <input type="range" id="player2Temp" min="0" max="1" step="0.1" value="0.4" />
          <span id="player2TempValue">0.4</span>
        </div>
        <button onclick="joinGame('player2')">Join Arena</button>
        
        <div id="player2Stats" class="hidden">
          <h3 style="margin-top: 20px; color: #ff6600;">Bot Status</h3>
          <div class="health-bar">
            <div id="player2Health" class="health-fill" style="width: 100%"></div>
          </div>
          <div id="player2Action" class="action-display">Waiting...</div>
        </div>
      </div>
    </div>

    <!-- Game Logs -->
    <div class="panel">
      <h2>📜 Battle Logs</h2>
      <div id="gameLogs" class="logs-panel">
        <div class="log-entry">Welcome to Agent Arena! Configure your models and join the battle.</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';
    let currentGameId = null;
    let player1Data = null;
    let player2Data = null;

    // Update temperature displays
    document.getElementById('player1Temp').addEventListener('input', (e) => {
      document.getElementById('player1TempValue').textContent = e.target.value;
    });
    document.getElementById('player2Temp').addEventListener('input', (e) => {
      document.getElementById('player2TempValue').textContent = e.target.value;
    });

    // Generate arena grid
    function generateArenaGrid() {
      const grid = document.getElementById('arenaGrid');
      grid.innerHTML = '';
      
      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 10; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${x}-${y}`;
          grid.appendChild(cell);
        }
      }
    }

    // Render arena with bots and obstacles
    function renderArena(gameState) {
      if (!gameState || !gameState.arena) return;

      // Clear previous bots
      document.querySelectorAll('.bot').forEach(bot => bot.remove());
      
      // Render obstacles and powerups
      gameState.arena.obstacles.forEach(obs => {
        const cell = document.getElementById(`cell-${obs.x}-${obs.y}`);
        if (cell) {
          cell.className = `cell ${obs.type}`;
        }
      });

      gameState.arena.powerups.forEach(pu => {
        const cell = document.getElementById(`cell-${pu.x}-${pu.y}`);
        if (cell) {
          cell.className = `cell powerup-${pu.type}`;
        }
      });

      // Render bots
      if (gameState.players) {
        gameState.players.forEach((player, index) => {
          const { x, y } = player.bot.position;
          const cell = document.getElementById(`cell-${x}-${y}`);
          if (cell) {
            const bot = document.createElement('div');
            bot.className = `bot bot-player${index + 1}`;
            bot.textContent = index + 1;
            cell.appendChild(bot);
          }
        });
      }
    }

    // Create new game
    async function createGame() {
      try {
        const response = await fetch(`${API_BASE}/game/create`, {
          method: 'POST'
        });
        const data = await response.json();
        currentGameId = data.gameId;
        addLog(`Game created: ${currentGameId}`);
        return currentGameId;
      } catch (error) {
        addLog(`Error creating game: ${error.message}`);
        return null;
      }
    }

    // Join game
    async function joinGame(playerNum) {
      if (!currentGameId) {
        await createGame();
      }

      const name = document.getElementById(`player${playerNum}Name`).value;
      const modelName = document.getElementById(`player${playerNum}Model`).value;
      const systemPrompt = document.getElementById(`player${playerNum}Prompt`).value;
      const maxTokens = parseInt(document.getElementById(`player${playerNum}Tokens`).value);
      const temperature = parseFloat(document.getElementById(`player${playerNum}Temp`).value);

      const modelConfig = {
        id: `player${playerNum}`,
        modelName,
        systemPrompt,
        maxTokens,
        temperature
      };

      try {
        const response = await fetch(`${API_BASE}/game/${currentGameId}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerName: name, modelConfig })
        });

        const data = await response.json();
        
        if (data.error) {
          addLog(`Error: ${data.error}`);
          return;
        }

        addLog(`${name} joined with model ${modelName}`);
        
        if (playerNum === 'player1') {
          player1Data = data.player;
          document.getElementById('player1Stats').classList.remove('hidden');
        } else {
          player2Data = data.player;
          document.getElementById('player2Stats').classList.remove('hidden');
        }

        updateGameStatus(data.game);

        if (data.game.status === 'ready') {
          document.getElementById('startBtn').disabled = false;
          addLog('Both players ready! Start the battle.');
        }
      } catch (error) {
        addLog(`Error joining game: ${error.message}`);
      }
    }

    // Start game
    async function startGame() {
      try {
        const response = await fetch(`${API_BASE}/game/${currentGameId}/start`, {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.error) {
          addLog(`Error: ${data.error}`);
          return;
        }

        addLog('Battle started!');
        updateGameStatus(data.game);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('nextTickBtn').disabled = false;
        
        renderArena(data.game.arena);
      } catch (error) {
        addLog(`Error starting game: ${error.message}`);
      }
    }

    // Execute next tick
    async function nextTick() {
      try {
        const response = await fetch(`${API_BASE}/game/${currentGameId}/tick`, {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.error) {
          addLog(`Error: ${data.error}`);
          return;
        }

        document.getElementById('tickCounter').textContent = data.tick;
        renderArena(data.gameState);
        
        // Update logs
        data.logs.forEach(log => addLog(log));

        // Update player actions and health
        if (data.gameState.players[0]) {
          const p1 = data.gameState.players[0];
          document.getElementById('player1Health').style.width = `${(p1.bot.hp / 100) * 100}%`;
          if (p1.bot.action) {
            document.getElementById('player1Action').textContent = 
              `${p1.bot.action.action} - ${p1.bot.action.reason || ''}`;
          }
        }

        if (data.gameState.players[1]) {
          const p2 = data.gameState.players[1];
          document.getElementById('player2Health').style.width = `${(p2.bot.hp / 100) * 100}%`;
          if (p2.bot.action) {
            document.getElementById('player2Action').textContent = 
              `${p2.bot.action.action} - ${p2.bot.action.reason || ''}`;
          }
        }

        // Check if game finished
        if (data.gameState.players.some(p => p.bot.hp <= 0)) {
          document.getElementById('nextTickBtn').disabled = true;
          const winner = data.gameState.players.find(p => p.bot.hp > 0);
          if (winner) {
            addLog(`🏆 ${winner.name} wins the battle!`);
          } else {
            addLog('🤝 Draw!');
          }
        }
      } catch (error) {
        addLog(`Error executing tick: ${error.message}`);
      }
    }

    // Update game status display
    function updateGameStatus(game) {
      const statusEl = document.getElementById('gameStatus');
      statusEl.textContent = game.status.toUpperCase();
      statusEl.className = `status-badge status-${game.status}`;
    }

    // Add log entry
    function addLog(message) {
      const logsPanel = document.getElementById('gameLogs');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsPanel.appendChild(entry);
      logsPanel.scrollTop = logsPanel.scrollHeight;
    }

    // Initialize
    generateArenaGrid();
  </script>
</body>
</html>
